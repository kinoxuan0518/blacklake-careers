stages:
  - test
  - prod
  - sync

variables:
  GIT_STRATEGY: none

# ─── 测试环境：push main 自动部署（陈继强 2026-09-09 配置）───
deploy-test:
  stage: test
  only:
    - main
  script:
    - sudo /root/job-update-test.sh
  tags:
    - www

# ─── 生产环境：手动点击部署 ───
deploy-prod:
  stage: prod
  only:
    - main
  when: manual
  script:
    - sudo /root/job-update-prod.sh
  tags:
    - www

# ─── 职位数据定时同步（配置步骤见 SYNC.md）───
# 定时/手动触发：拉取飞书招聘在招职位 → jobs.json 有变化则提交推送；
# 推送会再次触发上面的 deploy-test，实现「职位更新 → 测试站自动刷新」闭环。
sync-jobs:
  stage: sync
  image: python:3.11-slim
  variables:
    GIT_STRATEGY: fetch          # 覆盖全局 none：本 job 需要 checkout 才能提交
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"        # 允许手动 Run now 验证
  before_script:
    - git config --global user.name "blacklake-careers-bot"
    - git config --global user.email "bot@blacklake-careers.gitlab"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # checkout 用的是只读 CI_JOB_TOKEN，换成可推送的 Project Access Token（CI Variables：GL_PUSH_TOKEN）
    - git remote set-url origin "https://oauth2:${GL_PUSH_TOKEN}@gitlab.blacklake.tech/xuanzhenglong/blacklake-careers.git"
  script:
    - python3 scripts/sync_jobs.py            # 读取 FEISHU_APP_ID / FEISHU_APP_SECRET
    - |
      if git diff --quiet -- jobs.json; then
        echo "职位数据无变化，跳过提交"
      else
        git add jobs.json
        git commit -m "sync: 飞书招聘在招职位自动同步"
        git push origin HEAD:main
        echo "jobs.json 已更新并推送（将自动触发测试环境部署）"
      fi
