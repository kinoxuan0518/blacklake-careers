stages:
  - test
  - prod

variables:
  GIT_STRATEGY: none

# ─── 测试环境：push main 自动部署 ───
deploy-test:
  stage: test
  only:
    - main
  script:
    - sudo /root/job-update-test.sh
  tags:
    - www

# ─── 生产环境：手动点击部署 ───
deploy-prod:
  stage: prod
  only:
    - main
  when: manual
  script:
    - sudo /root/job-update-prod.sh
  tags:
    - www
